<app-auth-layout>
  <h1>Forgot password</h1>
  <p class="auth-lead">Enter an email to review the reset request. This preview cannot send mail.</p>

  <form class="stack-form" (ngSubmit)="submit()" novalidate>
    @if (error) {
      <p class="form-alert" role="alert"><strong>Email needed.</strong> {{ error }}</p>
    }
    @if (notice) {
      <p class="form-notice" role="status"><strong>Not sent.</strong> {{ notice }}</p>
    }

    <div>
      <label class="field-label" for="forgot-email">Email address</label>
      <div class="text-field" [class.is-invalid]="!!error">
        <input id="forgot-email" type="email" autocomplete="email" [value]="email" (input)="onEmail($event)" [attr.aria-invalid]="error ? true : null" />
      </div>
    </div>

    <button type="submit" class="mv-btn mv-btn-primary" [disabled]="busy" [attr.aria-busy]="busy">
      @if (busy) {
        <span class="btn-spinner" aria-hidden="true"></span>
        Submitting…
      } @else {
        Send reset link
      }
    </button>
  </form>

  <p class="form-links">
    <a routerLink="/login">Back to Login</a>
    <a routerLink="/reset-password">Continue to the reset form</a>
  </p>
</app-auth-layout>

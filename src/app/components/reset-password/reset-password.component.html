<app-auth-layout>
  <h1>Reset password</h1>
  <p class="auth-lead">Choose a new password to review the form. This preview cannot change a real password.</p>

  <form class="stack-form" (ngSubmit)="reset()" novalidate>
    @if (summary) {
      <p class="form-alert" role="alert"><strong>Check the form.</strong> {{ summary }}</p>
    }
    @if (notice) {
      <p class="form-notice" role="status"><strong>Static demo.</strong> {{ notice }}</p>
    }

    <div>
      <app-password-field
        label="New password"
        inputId="reset-password"
        autocomplete="new-password"
        [value]="password"
        [error]="passwordError"
        (valueChange)="password = $event; summary = ''"
      />
      <div class="strength" [attr.data-level]="strength.level" aria-live="polite">
        <span class="strength-label">Password strength: {{ strength.label }}</span>
        <span class="strength-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
    </div>

    <app-password-field
      label="Confirm new password"
      inputId="reset-confirm"
      autocomplete="new-password"
      [value]="confirm"
      [error]="confirmError"
      (valueChange)="confirm = $event; summary = ''"
    />

    <button type="submit" class="mv-btn mv-btn-primary" [disabled]="busy" [attr.aria-busy]="busy">
      @if (busy) {
        <span class="btn-spinner" aria-hidden="true"></span>
        Resetting…
      } @else {
        Reset Password
      }
    </button>
  </form>

  <p class="form-links">
    <a routerLink="/login">Back to Login</a>
  </p>
</app-auth-layout>
